<app-modal
  [isOpen]="isOpen"
  title="送信先のベンダーを選択"
  size="lg"
  customClass="vendor-selection-modal"
  (closed)="onClose()"
>
  <!-- Search Input -->
  <div class="relative w-full mb-2">
    <div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-gray">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
      >
        <path
          d="M19.0337 19.8332C19.5512 20.3478 20.3498 19.5535 19.8324 19.0501L15.6139 14.8441C17.094 13.2162 17.9121 11.0989 17.9088 8.90424C17.9088 3.99348 13.8928 0 8.95438 0C4.01597 0 0 3.99348 0 8.90424C0 13.815 4.01597 17.8085 8.95438 17.8085C11.1817 17.8085 13.2403 16.9919 14.8152 15.6383L19.0337 19.8332ZM1.1238 8.90424C1.1238 4.60873 4.6448 1.11862 8.95326 1.11862C13.273 1.11862 16.7827 4.60873 16.7827 8.90424C16.7827 13.1998 13.273 16.6899 8.95326 16.6899C4.6448 16.6899 1.1238 13.1998 1.1238 8.90424Z"
          fill="#066A9E"
        />
      </svg>
    </div>
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="ベンダーを検索..."
      class="w-full h-[45px] pl-12 pr-4 border border-primary rounded-full text-[14px] focus:outline-none focus:ring-2 focus:ring-primary/30"
    />
  </div>

  <!-- Vendor List -->
  <div class="vendor-list max-h-[350px] overflow-y-auto px-2 w-full bg-[#F5F5F4]">
    <div class="grid grid-cols-3 gap-x-4 gap-y-3">
      @for (vendor of filteredVendors; track vendor.id) {
      <label
        class="vendor-item flex items-center gap-2 py-2 cursor-pointer hover:bg-gray-50 transition-colors rounded"
        [class.selected]="isVendorSelected(vendor.id)"
      >
        <input
          type="checkbox"
          [checked]="isVendorSelected(vendor.id)"
          (change)="toggleVendor(vendor.id)"
          class="vendor-checkbox w-5 h-5 rounded border-2 cursor-pointer"
        />
        <span class="text-[14px] text-text-dark">{{ vendor.name }}</span>
      </label>
      }
    </div>
  </div>

  <!-- Action Button -->
  <div modal-actions>
    <button
      type="button"
      class="px-5 py-2.5 bg-primary text-white rounded-lg text-[14px] hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center w-[80px]"
      [disabled]="selectedCount === 0 || isLoading"
      (click)="onSend()"
    >
      @if (isLoading) {
      <span class="btn-spinner"></span>
      } @else { 送信 }
    </button>
  </div>
</app-modal>
