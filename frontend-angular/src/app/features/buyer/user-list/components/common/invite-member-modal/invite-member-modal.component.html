<app-modal
  [isOpen]="isOpen"
  title="新しいメンバーを招待"
  size="md"
  customClass="invite-member-modal"
  [isLoading]="isSaving"
  (closed)="onClose()"
>
  @if (modalType === 'form') {
  <ng-container>
    <!-- Form Mode -->
    <div class="invite-form-content mb-3">
      <!-- Description text -->
      <div class="description-text">
        <p>追加したいメンバーのメールアドレスを入力してください。</p>
        <p>入力したメールアドレス宛に招待メールを送信します。</p>
        <p class="note">※ 招待メールの有効期限は10日間です。</p>
      </div>

      <!-- Email inputs -->
      <div class="email-inputs-container">
        @for (email of emails; track $index; let isLast = $last) {
        <div class="email-field-wrapper">
          <div class="email-input-row">
            <input
              type="email"
              class="email-input"
              [class.has-error]="email.error"
              [placeholder]="getPlaceholder()"
              [(ngModel)]="email.value"
              (input)="onEmailChange($index)"
            />
            @if (isLast) {
            <button
              type="button"
              class="add-btn"
              [class.active]="canAddMore()"
              [disabled]="!canAddMore()"
              (click)="addEmailField()"
              aria-label="Add email field"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="35"
                height="35"
                viewBox="0 0 35 35"
                fill="none"
              >
                <path
                  d="M17.4996 29.4001C10.9196 29.4001 5.59961 24.0801 5.59961 17.5001C5.59961 10.9201 10.9196 5.6001 17.4996 5.6001C24.0796 5.6001 29.3996 10.9201 29.3996 17.5001C29.3996 24.0801 24.0796 29.4001 17.4996 29.4001ZM17.4996 7.0001C11.6896 7.0001 6.99961 11.6901 6.99961 17.5001C6.99961 23.3101 11.6896 28.0001 17.4996 28.0001C23.3096 28.0001 27.9996 23.3101 27.9996 17.5001C27.9996 11.6901 23.3096 7.0001 17.4996 7.0001Z"
                  fill="#066A9E"
                />
                <path d="M11.2002 16.7998H23.8002V18.1998H11.2002V16.7998Z" fill="#066A9E" />
                <path d="M16.7998 11.2002H18.1998V23.8002H16.7998V11.2002Z" fill="#066A9E" />
              </svg>
            </button>
            } @else {
            <!-- Spacer to keep input width consistent -->
            <div class="add-btn-spacer"></div>
            }
          </div>
          @if (email.error) {
          <span class="error-message">{{ email.error }}</span>
          }
        </div>
        }
      </div>
    </div>

    <!-- Buttons -->
    <div modal-actions class="action-buttons">
      <button type="button" class="btn-cancel" (click)="onClose()">キャンセル</button>
      <button
        type="button"
        class="btn-send"
        [disabled]="isSaving || !hasValidEmails()"
        (click)="onSendInvitation()"
      >
        @if (isSaving) {
        <span class="loading loading-spinner loading-sm"></span>
        } @else { 招待メールを送信 }
      </button>
    </div>
  </ng-container>
  } @else {
  <ng-container>
    <!-- Completion Mode -->
    <div class="complete-content mb-3">
      <p class="complete-message">招待メールを送信しました。</p>
    </div>

    <div modal-actions class="action-buttons">
      <button type="button" class="btn-cancel" (click)="onClose()">閉じる</button>
    </div>
  </ng-container>
  }
</app-modal>
