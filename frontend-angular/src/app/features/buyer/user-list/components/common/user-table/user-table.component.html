<!-- User Table matching Figma H-01 design -->
<div class="table-container">
  <table class="user-table">
    <!-- Table Header -->
    <thead>
      <tr class="header-row">
        @if (showCheckbox) {
        <th class="checkbox-cell header-cell">
          <label class="checkbox-wrapper">
            <input
              type="checkbox"
              [checked]="isAllSelected"
              (change)="onToggleAllSelection()"
              class="checkbox"
            />
            <span class="checkmark"></span>
          </label>
        </th>
        }
        <th class="user-cell flex justify-center">ユーザー</th>
        <th class="permission-cell header-cell">権限</th>
        <th class="action-cell header-cell"></th>
      </tr>
    </thead>

    <!-- Table Body -->
    <tbody>
      @for (user of users; track user.id) {
      <tr class="data-row">
        @if (showCheckbox) {
        <td class="checkbox-cell">
          <label class="checkbox-wrapper">
            <input
              type="checkbox"
              [checked]="user.isSelected"
              (change)="onToggleSelection(user.id)"
              class="checkbox"
            />
            <span class="checkmark" [class.checked]="user.isSelected"></span>
          </label>
        </td>
        }
        <td class="user-cell">
          <div class="user-info">
            <div class="avatar" [style.background-color]="user.avatarColor">
              <span class="avatar-text">{{ user.initials }}</span>
            </div>
            <span class="user-name">{{ user.name }}</span>
          </div>
        </td>
        <td class="permission-cell">
          <span class="permission-text">{{ getPermissionLabel(user.permission) }}</span>
        </td>
        <td class="action-cell">
          <button class="change-btn" (click)="onChangePermission(user.id)">変更</button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
