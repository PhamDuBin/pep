<!-- Email Change Modal matching Figma G-02, G-03 design -->
<app-modal
  [isOpen]="isOpen"
  title="メールアドレスを変更"
  size="lg"
  customClass="email-change-modal"
  (closed)="onClose()"
>
  @if (modalType === 'email-change') {
  <ng-container>
    <!-- Email Change Form -->
    <div class="modal-description">
      <p>新しいメールアドレス入力してください。</p>
      <p>メールアドレス再設定用URLを送信します。</p>
    </div>

    <div class="form-fields">
      <!-- New Email -->
      <div class="form-row">
        <label class="form-label">新しいメールアドレス</label>
        <input
          type="email"
          class="form-input"
          placeholder="メールアドレス"
          [value]="newEmail"
          (input)="onNewEmailInput($event)"
        />
      </div>

      <!-- Confirm Email -->
      <div class="form-row">
        <label class="form-label">新しいメールアドレス（確認）</label>
        <input
          type="email"
          class="form-input"
          placeholder="メールアドレス"
          [value]="confirmEmail"
          (input)="onConfirmEmailInput($event)"
        />
      </div>
    </div>

    <div modal-actions class="actions-row">
      <button class="btn-secondary" type="button" (click)="onClose()">キャンセル</button>
      <button class="btn-primary" type="button" [disabled]="isSaving" (click)="onSendEmail()">
        @if (isSaving) {
          <span class="btn-spinner"></span>
        } @else {
          メールを送信
        }
      </button>
    </div>
  </ng-container>
  } @else if (modalType === 'email-sent') {
  <ng-container>
    <!-- Email Sent Confirmation -->
    <div class="modal-description centered">
      <p>ご入力いただいたメールアドレスへ再設定用URLを送信しました。</p>
      <p>メール内のURLをクリックすると、</p>
      <p>メールアドレス変更が完了いたします。</p>
    </div>

    <div modal-actions class="actions-row">
      <button class="btn-secondary" type="button" (click)="onClose()">閉じる</button>
    </div>
  </ng-container>
  }
</app-modal>
