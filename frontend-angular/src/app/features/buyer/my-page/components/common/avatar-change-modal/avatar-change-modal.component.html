<!-- Avatar Change Modal matching Figma G-04 design -->
<app-modal
  [isOpen]="isOpen"
  title="アイコンの変更"
  size="md"
  customClass="avatar-change-modal"
  (closed)="onClose()"
>
  <!-- Color Options -->
  <div class="color-options">
    @for (option of colorOptions; track option.id) {
    <button
      class="color-option"
      type="button"
      [style.background-color]="option.color"
      [class.selected]="option.isSelected"
      [style.border-color]="option.isSelected ? '#066a9e' : 'transparent'"
      (click)="onColorSelect(option.id)"
    ></button>
    }
  </div>

  <div modal-actions class="flex flex-row gap-[10px] justify-center items-center">
    <button
      class="btn-primary"
      type="button"
      [disabled]="isSaving"
      (click)="onSave()"
    >
      @if (isSaving) {
        <span class="loading loading-spinner loading-sm"></span>
      } @else {
        保存
      }
    </button>
    <button class="btn-secondary" type="button" (click)="onClose()">
      閉じる
    </button>
  </div>
</app-modal>
