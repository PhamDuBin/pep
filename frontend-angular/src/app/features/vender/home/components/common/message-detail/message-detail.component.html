<div class="flex flex-col h-full bg-white">
    @if (!messageId) {
    <div class="flex justify-center items-center w-full h-full">
        <p class="font-noto font-normal text-[16px] leading-[22px] text-text-gray m-0">バイヤーを選択してください</p>
    </div>
    } @else {
    <!-- Header Section -->
    <div class="flex justify-between items-center px-[25px] py-[10px] h-[74px] border-b border-[#D9D9D9]">
        <div class="flex flex-col gap-[5px]">
            <!-- Company Name -->
            <div class="flex items-center gap-[15px]">
                <h2 class="font-noto font-bold text-[16px] leading-[22px] text-text-dark m-0">{{ companyName }}</h2>
            </div>

            <!-- Project Badge -->
            <div class="flex items-center px-[10px] py-[4px] border border-primary rounded-full">
                <span class="font-noto font-medium text-[14px] leading-[19px] text-primary">{{ projectName }}</span>
            </div>
        </div>

        <!-- Document Icon -->
        <div class="flex items-center p-[3px]">
            <img src="assets/icons/vendor-docutment-stack.svg" alt="Documents" class="w-[29px] h-[30px]" />
        </div>
    </div>

    <!-- Messages Thread -->
    <div #messageContainer class="flex flex-col gap-[10px] px-[25px] py-[25px] flex-1 overflow-y-auto">
        @for (message of messages(); track message.id) {
        @if (message.isFromUser) {
        <!-- User Message (Right Aligned) -->
        <div class="flex justify-end">
            <div class="flex flex-col items-end gap-[2px] w-full max-w-[301px]">
                <div
                    class="flex justify-center items-center px-[7px] py-[7px] w-full min-h-[68px] bg-primary-light border border-[#8EC0D0] rounded">
                    <p class="font-noto font-normal text-[13px] leading-[18px] text-text-dark m-0 flex-1">{{
                        message.content }}</p>
                </div>
                <span class="font-noto font-normal text-[10px] leading-[19px] text-center text-text-gray">{{
                    message.timestamp }}</span>
            </div>
        </div>
        } @else {
        <!-- Other Party Message (Left Aligned) -->
        <div class="flex items-start gap-[10px]">
            <!-- Avatar -->
            <div class="w-[25px] h-[25px] bg-text-gray rounded-full flex-shrink-0"></div>

            <!-- Message Content -->
            <div class="flex flex-col items-start gap-[2px] w-full max-w-[301px]">
                <div
                    class="flex justify-center items-center px-[7px] py-[7px] w-full min-h-[68px] bg-white border border-[#8EC0D0] rounded">
                    <p class="font-noto font-normal text-[13px] leading-[18px] text-text-dark m-0 flex-1">{{
                        message.content }}</p>
                </div>
                <span class="font-noto font-normal text-[10px] leading-[19px] text-center text-text-gray">{{
                    message.timestamp }}</span>
            </div>
        </div>
        }
        }
    </div>

    <!-- Message Input -->
    <div class="flex justify-center items-center px-[25px] pb-[35px]">
        <div
            class="flex justify-between items-center px-[15px] py-[10px] w-full h-[40px] border border-[#B9B9B9] rounded">
            <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="メッセージを入力"
                class="font-noto font-normal text-[14px] leading-[19px] text-text-gray flex-1 outline-none border-none bg-transparent" />
            <button (click)="sendMessage()"
                class="flex items-center justify-center w-[20px] h-[20px] cursor-pointer bg-transparent border-none p-0">
                <img src="assets/icons/vendor-send.svg" alt="Send" class="w-[20px] h-[20px]" />
            </button>
        </div>
    </div>
    }
</div>
