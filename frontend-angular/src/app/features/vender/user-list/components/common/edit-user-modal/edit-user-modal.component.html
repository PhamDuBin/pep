@if (isOpen && user) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" (click)="onBackdropClick($event)">
    <!-- Modal Content -->
    <div
        class="relative bg-white rounded-[12px] shadow-xl w-[800px] p-[20px_35px] flex flex-col items-center gap-[25px]">

        <!-- Close Button (Outside modal, top-right) -->
        <button type="button" (click)="onCancel()"
            class="absolute -top-[20px] -right-[20px] w-[40px] h-[40px] bg-[#F5F5F5] rounded-full flex items-center justify-center hover:bg-[#E5E5E5] transition-colors">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 5.579L0.709846 9.86915C0.633519 9.94548 0.539745 9.98637 0.428524 9.99182C0.317304 9.99727 0.218079 9.95638 0.130847 9.86915C0.0436156 9.78192 0 9.68542 0 9.57965C0 9.47388 0.0436156 9.37739 0.130847 9.29015L4.421 5L0.130847 0.709846C0.0545195 0.633519 0.0136297 0.539745 0.00817775 0.428524C0.00272578 0.317304 0.0436156 0.218079 0.130847 0.130847C0.218079 0.0436156 0.314578 0 0.420347 0C0.526115 0 0.622615 0.0436156 0.709846 0.130847L5 4.421L9.29015 0.130847C9.36648 0.0545195 9.46053 0.0136297 9.57229 0.00817775C9.68297 0.00272578 9.78192 0.0436156 9.86915 0.130847C9.95638 0.218079 10 0.314578 10 0.420347C10 0.526115 9.95638 0.622615 9.86915 0.709846L5.579 5L9.86915 9.29015C9.94548 9.36648 9.98637 9.46053 9.99182 9.57229C9.99727 9.68297 9.95638 9.78192 9.86915 9.86915C9.78192 9.95638 9.68542 10 9.57965 10C9.47388 10 9.37739 9.95638 9.29015 9.86915L5 5.579Z" fill="#333333" />
            </svg>
        </button>

        <!-- Title -->
        <h2 class="font-noto font-normal text-[20px] leading-[27px] text-[#066A9E] w-full text-center">権限変更</h2>

        <!-- Message and Radio Buttons -->
        <div class="flex flex-col items-center gap-[25px]">
            <div class="flex flex-col items-center gap-[10px]">
                <p class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">
                    このユーザーを以下の権限へ変更します。
                </p>

                <!-- Radio Buttons -->
                <div class="flex flex-row items-center gap-[25px]">
                    <!-- Admin Radio -->
                    <label class="flex flex-row items-center gap-[5px] cursor-pointer">
                        <input type="radio" name="role" value="管理者" [(ngModel)]="selectedRole"
                            class="w-[24px] h-[24px] cursor-pointer" />
                        <span class="font-noto-jp text-[14px] leading-[18px] text-[#333333]">管理者</span>
                    </label>

                    <!-- Member Radio -->
                    <label class="flex flex-row items-center gap-[5px] cursor-pointer">
                        <input type="radio" name="role" value="メンバー" [(ngModel)]="selectedRole"
                            class="w-[24px] h-[24px] cursor-pointer" />
                        <span class="font-noto-jp text-[14px] leading-[18px] text-[#333333]">メンバー</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Permissions Table -->
        <div class="w-[730px] border border-[#D4D4D4] rounded-[4px] overflow-hidden">
            <table class="w-full">
                <!-- Header Row -->
                <thead>
                    <tr class="h-[50px] bg-[#F5F5F5]">
                        <th class="border-t border-[#D4D4D4] w-[243.33px]">
                            <div class="flex justify-center items-center p-[15px_12px]">
                                <span
                                    class="font-inter font-semibold text-[14px] leading-[130%] text-center text-[#333333]">機能</span>
                            </div>
                        </th>
                        <th class="border-t border-[#D4D4D4] w-[243.33px]">
                            <div class="flex justify-center items-center p-[15px_12px]">
                                <span
                                    class="font-inter font-semibold text-[14px] leading-[130%] text-center text-[#333333]">管理者</span>
                            </div>
                        </th>
                        <th class="border-t border-[#D4D4D4] w-[243.33px]">
                            <div class="flex justify-center items-center p-[15px_12px]">
                                <span
                                    class="font-inter font-semibold text-[14px] leading-[130%] text-center text-[#333333]">メンバー</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <!-- Body Rows -->
                <tbody>
                    <!-- Row 1: Account/Organization -->
                    <tr class="h-[56px]">
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex justify-center items-center p-[10px_12px]">
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">アカウント・組織</span>
                            </div>
                        </td>
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex justify-center items-center p-[10px_12px]">
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">組織設定の変更/メンバー招待・権限変更/退会</span>
                            </div>
                        </td>
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex justify-center items-center p-[10px_12px]">
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">自分のプロフィール変更</span>
                            </div>
                        </td>
                    </tr>

                    <!-- Row 2: Chat -->
                    <tr class="h-[62px]">
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex justify-center items-center p-[10px_12px]">
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">チャット（発注者↔︎ベンダー）</span>
                            </div>
                        </td>
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex flex-col justify-center items-center p-[10px_12px] gap-[4px]">
                                <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                        fill="#066A9E" />
                                </svg>
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">(送受信/クローズ)</span>
                            </div>
                        </td>
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex flex-col justify-center items-center p-[10px_12px] gap-[4px]">
                                <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                        fill="#066A9E" />
                                </svg>
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">(送受信)※招待された時のみ</span>
                            </div>
                        </td>
                    </tr>

                    <!-- Row 3: Payment/Billing -->
                    <tr class="h-[62px]">
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex justify-center items-center p-[10px_12px]">
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">決済/請求</span>
                            </div>
                        </td>
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex flex-col justify-center items-center p-[10px_12px] gap-[4px]">
                                <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                        fill="#066A9E" />
                                </svg>
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">(請求)</span>
                            </div>
                        </td>
                        <td class="border-t border-[#D4D4D4] bg-white/[0.002]">
                            <div class="flex justify-center items-center p-[10px_12px]">
                                <span
                                    class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#333333]">-</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Save Button -->
        <button type="button" (click)="onSave()"
            class="px-[15px] py-[10px] bg-[#066A9E] text-white rounded-[8px] font-noto text-[14px] leading-[19px] hover:bg-[#055580] transition-colors">
            保存
        </button>
    </div>
</div>
}
