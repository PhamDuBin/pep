@if (isOpen) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/10" (click)="onBackdropClick($event)">
    <!-- Modal Content -->
    <div
        class="relative bg-white rounded-[12px] shadow-xl w-[518px] p-[20px_35px] flex flex-col items-center gap-[25px]">

        <!-- Close Button (Outside modal, top-right) -->
        <button type="button" (click)="onCancel()"
            class="absolute -top-[20px] -right-[20px] w-[40px] h-[40px] bg-[#F5F5F5] rounded-full flex items-center justify-center hover:bg-[#E5E5E5] transition-colors">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M5 5.579L0.709846 9.86915C0.633519 9.94548 0.539745 9.98637 0.428524 9.99182C0.317304 9.99727 0.218079 9.95638 0.130847 9.86915C0.0436156 9.78192 0 9.68542 0 9.57965C0 9.47388 0.0436156 9.37739 0.130847 9.29015L4.421 5L0.130847 0.709846C0.0545195 0.633519 0.0136297 0.539745 0.00817775 0.428524C0.00272578 0.317304 0.0436156 0.218079 0.130847 0.130847C0.218079 0.0436156 0.314578 0 0.420347 0C0.526115 0 0.622615 0.0436156 0.709846 0.130847L5 4.421L9.29015 0.130847C9.36648 0.0545195 9.46053 0.0136297 9.57229 0.00817775C9.68297 0.00272578 9.78192 0.0436156 9.86915 0.130847C9.95638 0.218079 10 0.314578 10 0.420347C10 0.526115 9.95638 0.622615 9.86915 0.709846L5.579 5L9.86915 9.29015C9.94548 9.36648 9.98637 9.46053 9.99182 9.57229C9.99727 9.68297 9.95638 9.78192 9.86915 9.86915C9.78192 9.95638 9.68542 10 9.57965 10C9.47388 10 9.37739 9.95638 9.29015 9.86915L5 5.579Z"
                    fill="#333333" />
            </svg>
        </button>

        <!-- Title -->
        <h2 class="font-noto font-normal text-[20px] leading-[27px] text-[#066A9E] w-full text-center">
            新しいメンバーを招待
        </h2>

        <!-- Instructions and Email Inputs -->
        <div class="flex flex-col items-center gap-[25px] w-full">
            <!-- Instructions -->
            <p class="font-noto-jp font-medium text-[14px] leading-[24px] text-center text-[#333333] w-[378px]">
                追加したいメンバーのメールアドレスを入力してください。<br />
                入力したメールアドレス宛に招待メールを送信します。<br />
                ※ 招待メールの有効期限は10日間です。
            </p>

            <!-- Email Input Fields -->
            <div class="flex flex-col items-start gap-[10px] w-[378px]">
                @for (field of emailFields(); track field.id) {
                <div class="flex flex-col items-start gap-[5px] w-full">
                    <!-- Input Row -->
                    <div class="flex flex-row items-center gap-[10px] w-full">
                        <!-- Email Input -->
                        <input type="email" [(ngModel)]="field.value" (ngModelChange)="onEmailChange(field)"
                            placeholder="email@address.com"
                            class="w-[333px] h-[35px] px-[10px] py-[3px] bg-white border border-[#B9B9B9] rounded-[4px] font-noto text-[16px] leading-[22px] text-[#333333] placeholder:text-[#B9B9B9] focus:outline-none focus:border-[#066A9E]"
                            [class.border-[#C10000]]="field.error" />

                        <!-- Plus Button  -->
                        @if ($index === emailFields().length - 1) {
                        <button type="button" (click)="addEmailField()"
                            class="w-[35px] h-[35px] flex items-center justify-center hover:opacity-80 transition-opacity">
                            <img src="/assets/icons/ei_plus.svg" alt="Add email" class="w-[35px] h-[35px]" />
                        </button>
                        } @else {
                        <div class="w-[35px] h-[35px]"></div>
                        }
                    </div>

                    <!-- Error Message -->
                    @if (field.error) {
                    <span class="text-[#C10000] text-[12px] leading-[16px] font-noto">{{ field.error }}</span>
                    }
                </div>
                }
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-row items-start gap-[10px]">
            <!-- Cancel Button -->
            <button type="button" (click)="onCancel()"
                class="px-[15px] py-[10px] h-[39px] bg-[#E1E1E1] rounded-[8px] font-noto text-[14px] leading-[19px] text-[#333333] hover:bg-[#D1D1D1] transition-colors">
                キャンセル
            </button>

            <!-- Send Invitation Button -->
            <button type="button" (click)="onInvite()"
                class="px-[15px] py-[10px] h-[39px] bg-[#333333] rounded-[8px] font-noto text-[14px] leading-[19px] text-white hover:bg-[#1a1a1a] transition-colors">
                招待メールを送信
            </button>
        </div>
    </div>
</div>
}
