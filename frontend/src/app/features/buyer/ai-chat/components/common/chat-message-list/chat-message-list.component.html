<div
  #messageContainer
  class="flex flex-col gap-[20px] w-full h-full overflow-y-auto pr-2"
  (scroll)="onScroll()"
>
  @for (message of messages; track trackByMessageId($index, message)) {
    <app-chat-message
      [message]="message"
      [animate]="message.isNew === true"
    ></app-chat-message>
  }

  @if (isLoading) {
    <div class="flex justify-start animate-fade-in">
      <div class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-lg">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="text-[14px] text-text-gray">AIが考えています...</span>
      </div>
    </div>
  }
</div>
