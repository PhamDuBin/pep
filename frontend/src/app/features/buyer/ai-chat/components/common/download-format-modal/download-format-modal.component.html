@if (isOpen) {
  <div
    class="modal-backdrop fixed inset-0 bg-black/30 flex items-center justify-center z-50"
    (click)="onBackdropClick($event)"
  >
    <div class="modal-content bg-white rounded-lg shadow-xl p-6 min-w-[400px] animate-modal-in">
      <!-- Close Button -->
      <button
        type="button"
        class="absolute top-4 right-4 text-text-gray hover:text-text-dark transition-colors"
        (click)="onClose()"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Title -->
      <h2 class="text-[16px] text-primary text-center font-normal mb-6">
        保存形式を選択してください
      </h2>

      <!-- Format Options -->
      <div class="flex justify-center gap-8 mb-6">
        <!-- PDF Option -->
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            name="format"
            value="pdf"
            [(ngModel)]="selectedFormat"
            class="radio radio-primary radio-sm"
          />
          <span class="text-[14px] text-text-dark">PDF形式</span>
        </label>

        <!-- PPT Option -->
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            name="format"
            value="ppt"
            [(ngModel)]="selectedFormat"
            class="radio radio-primary radio-sm"
          />
          <span class="text-[14px] text-text-dark">PPT(β版)形式</span>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-center gap-3">
        <button
          type="button"
          class="px-6 py-2 bg-text-dark text-white rounded-lg text-[14px] hover:opacity-90 transition-opacity"
          (click)="onDownload()"
        >
          ダウンロード
        </button>
        <button
          type="button"
          class="px-6 py-2 border border-border-gray rounded-lg text-[14px] text-text-dark hover:bg-gray-50 transition-colors"
          (click)="onClose()"
        >
          閉じる
        </button>
      </div>
    </div>
  </div>
}
