<div
  class="flex w-full message-container"
  [class.justify-end]="isUserMessage"
  [class.justify-start]="!isUserMessage"
  [class.animate-slide-in-right]="isUserMessage && message.isNew"
  [class.animate-slide-in-left]="!isUserMessage && message.isNew"
>
  @if (isUserMessage) {
    <!-- User Message (Right aligned, blue bubble) -->
    <div class="max-w-[70%] bg-primary text-white px-[10px] py-[10px] rounded-tl-[12px] rounded-tr-[12px] rounded-bl-[12px] shadow-md">
      <p class="text-[14px] font-normal leading-normal whitespace-pre-wrap">{{ displayedContent }}</p>
    </div>
  } @else {
    <!-- AI Message (Left aligned, plain text) -->
    <div class="max-w-[600px] relative cursor-pointer" (click)="skipTyping()">
      <div class="text-[14px] text-text-dark font-normal leading-normal whitespace-pre-wrap ai-message-content">
        <span>{{ displayedContent }}</span>
        @if (isTyping) {
          <span class="typing-cursor">|</span>
        }
      </div>
      @if (hasHighlight && !isTyping) {
        <div class="mt-2 bg-yellow-100 px-2 py-1 rounded animate-fade-in">
          <p class="text-[14px] text-text-dark whitespace-pre-wrap">{{ message.highlightedText }}</p>
        </div>
      }
      @if (isTyping) {
        <p class="text-[11px] text-text-gray mt-2 opacity-60">クリックでスキップ</p>
      }
    </div>
  }
</div>
