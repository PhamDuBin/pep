<!-- Archive Card matching Figma F-01 design -->
<div class="archive-card">
  <!-- Project Name Card -->
  <div class="card-content">
    <p class="project-name">{{ project.name }}</p>
  </div>

  <!-- Card Footer -->
  <div class="card-footer">
    <div class="author-info">
      <!-- Author Icon -->
      <svg class="pen-icon" width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7.85714 2.14286L9.71429 4M1 12.8571L1.23214 10.7768C1.25595 10.5634 1.26786 10.4567 1.29732 10.3567C1.32355 10.2679 1.3603 10.1824 1.40671 10.1023C1.45906 10.0122 1.52798 9.93155 1.66577 9.77024L7.40476 3.34286C7.65 3.06429 7.77262 2.925 7.92024 2.87262C8.0504 2.82619 8.19246 2.82619 8.32262 2.87262C8.47024 2.925 8.59286 3.06429 8.8381 3.34286L9.51476 4.11429C9.76 4.39286 9.88262 4.53214 9.93024 4.68929C9.97262 4.82738 9.97262 4.97619 9.93024 5.11429C9.88262 5.27143 9.76 5.41071 9.51476 5.68929L3.77577 12.1167C3.62286 12.2881 3.54643 12.3738 3.45536 12.4405C3.37405 12.4995 3.28452 12.5476 3.19 12.5833C3.08357 12.6233 2.97 12.6381 2.74286 12.6676L1 12.8571Z" stroke="#808080" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="author-name">{{ project.authorName }}</span>
    </div>
    <span class="created-date">{{ project.createdAt }}</span>
  </div>

  <!-- Action Buttons Row -->
  <div class="card-actions">
    <div class="spacer"></div>
    @if (project.isFavorite) {
      <svg class="star-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#F5A623" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
    <!-- Menu Button -->
    <button class="menu-btn" (click)="onMenuClick($event)" type="button">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="10" r="1.5" fill="#808080"/>
        <circle cx="10" cy="10" r="1.5" fill="#808080"/>
        <circle cx="16" cy="10" r="1.5" fill="#808080"/>
      </svg>
    </button>
  </div>
</div>
