<div class="pdf-preview-container border border-border-gray rounded-lg p-4 bg-white">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-[14px] text-text-dark font-normal">PDFページプレビュー</h3>
    <span class="text-[14px] text-primary">完了({{ completedCount }}/{{ totalCount }})</span>
  </div>

  <!-- Page Thumbnails -->
  <div class="flex gap-3 mb-4 overflow-x-auto pb-2">
    @for (page of pages; track page.id) {
      <div class="flex flex-col items-center min-w-[80px]">
        <!-- Thumbnail -->
        <div class="w-[80px] h-[100px] border border-border-gray rounded bg-gray-50 flex items-center justify-center mb-2">
          <div class="w-[60px] h-[80px] bg-white border border-gray-200 rounded shadow-sm flex items-center justify-center">
            <span class="text-[10px] text-text-gray">PDF</span>
          </div>
        </div>
        <!-- Page Title -->
        <span class="text-[12px] text-text-dark text-center whitespace-nowrap">{{ page.title }}</span>
        <span class="text-[11px] text-text-gray">Page{{ page.pageNumber }}</span>
      </div>
    }
  </div>

  <!-- Action Buttons -->
  <div class="flex gap-3">
    <button
      type="button"
      class="flex items-center gap-2 px-4 py-2 border border-border-gray rounded-lg text-[14px] text-text-dark hover:bg-gray-50 transition-colors"
      (click)="onDownload()"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 12L3 7H6V2H10V7H13L8 12Z" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 14H14" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>プロジェクト計画書をダウンロード</span>
    </button>

    <button
      type="button"
      class="px-6 py-2 bg-primary text-white rounded-lg text-[14px] hover:opacity-90 transition-opacity"
      (click)="onConfirm()"
    >
      確認
    </button>
  </div>
</div>
