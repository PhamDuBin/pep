<app-modal
  [isOpen]="isOpen"
  title="保存形式を選択してください"
  size="sm"
  (closed)="onClose()"
>
  <!-- Format Options -->
  <div class="flex justify-center gap-8">
    <!-- PDF Option -->
    <label class="flex items-center gap-2 cursor-pointer">
      <input
        type="radio"
        name="format"
        value="pdf"
        [(ngModel)]="selectedFormat"
        class="radio radio-primary radio-sm"
      />
      <span class="text-[14px] text-text-dark">PDF形式</span>
    </label>

    <!-- PPT Option -->
    <label class="flex items-center gap-2 cursor-pointer">
      <input
        type="radio"
        name="format"
        value="ppt"
        [(ngModel)]="selectedFormat"
        class="radio radio-primary radio-sm"
      />
      <span class="text-[14px] text-text-dark">PPT(β版)形式</span>
    </label>
  </div>

  <!-- Action Buttons -->
  <div modal-actions class="flex flex-row gap-[10px] justify-center items-center">
    <button
      type="button"
      class="px-6 py-2 bg-text-dark text-white rounded-lg text-[14px] hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[120px]"
      [disabled]="isLoading"
      (click)="onDownload()"
    >
      @if (isLoading) {
        <span class="btn-spinner"></span>
      } @else {
        ダウンロード
      }
    </button>
    <button
      type="button"
      class="px-6 py-2 border border-border-gray rounded-lg text-[14px] text-text-dark hover:bg-gray-50 transition-colors"
      (click)="onClose()"
    >
      閉じる
    </button>
  </div>
</app-modal>
