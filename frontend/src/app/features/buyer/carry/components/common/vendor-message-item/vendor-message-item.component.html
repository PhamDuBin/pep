<!-- Vendor message item matching Figma design exactly -->
<button
  type="button"
  class="vendor-message-item"
  [class.selected]="isSelected"
  (click)="onSelect()"
>
  <!-- Content -->
  <div class="vendor-content">
    <!-- Vendor name -->
    <span class="vendor-name">{{ vendor.name }}</span>
    <!-- Last message -->
    @if (vendor.lastMessage) {
      <p class="last-message">{{ vendor.lastMessage }}</p>
    }
  </div>

  <!-- Timestamp -->
  @if (vendor.lastMessageTime) {
    <div class="timestamp-wrapper">
      <span class="timestamp">{{ vendor.lastMessageTime }}</span>
    </div>
  }
</button>
