<div class="flex items-center gap-[10px] w-full max-w-[710px]">
  <!-- Input Container -->
  <div class="input-container flex items-center flex-1 gap-[10px] pl-[15px] pr-[10px] py-[10px] h-[45px] bg-white border border-border-gray rounded-full shadow-input transition-all duration-200"
       [class.input-focus]="message.trim()">
    <input
      type="text"
      [(ngModel)]="message"
      [placeholder]="placeholder"
      class="flex-1 text-[13px] text-text-dark placeholder-text-gray outline-none border-none bg-transparent"
      (keydown)="onKeydown($event)"
    />
  </div>

  <!-- Mic Button -->
  <button
    type="button"
    class="mic-button w-[30px] h-[30px] flex items-center justify-center rounded-full hover:bg-gray-100 transition-all duration-200 active:scale-90"
    (click)="onMicrophoneClick()"
    aria-label="音声入力"
  >
    <svg width="20" height="28" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 0C8.67392 0 7.40215 0.526784 6.46447 1.46447C5.52678 2.40215 5 3.67392 5 5V13C5 14.3261 5.52678 15.5979 6.46447 16.5355C7.40215 17.4732 8.67392 18 10 18C11.3261 18 12.5979 17.4732 13.5355 16.5355C14.4732 15.5979 15 14.3261 15 13V5C15 3.67392 14.4732 2.40215 13.5355 1.46447C12.5979 0.526784 11.3261 0 10 0Z" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 11V13C1 15.3869 1.94821 17.6761 3.63604 19.364C5.32387 21.0518 7.61305 22 10 22C12.3869 22 14.6761 21.0518 16.364 19.364C18.0518 17.6761 19 15.3869 19 13V11" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 22V28" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 28H15" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Send Button -->
  <button
    type="button"
    class="send-button w-[40px] h-[40px] flex items-center justify-center bg-primary rounded-full transition-all duration-200"
    (click)="sendMessage()"
    [disabled]="!message.trim()"
    [class.opacity-50]="!message.trim()"
    [class.cursor-not-allowed]="!message.trim()"
    [class.hover:scale-105]="message.trim()"
    [class.active:scale-95]="message.trim()"
    [class.hover:shadow-lg]="message.trim()"
    aria-label="送信"
  >
    <svg class="send-icon" width="15" height="19" viewBox="0 0 15 19" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7.5 17V2M7.5 2L1 8.5M7.5 2L14 8.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
