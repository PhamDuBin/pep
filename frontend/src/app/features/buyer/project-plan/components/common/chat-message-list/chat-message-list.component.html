<div
  #scrollContainer
  class="message-list flex flex-col gap-4 h-full overflow-y-auto pr-2"
>
  @for (message of messages; track trackByMessageId($index, message)) {
    <app-chat-message [message]="message"></app-chat-message>
  }

  <!-- Loading indicator -->
  @if (isLoading) {
    <div class="flex gap-3 w-full">
      <div class="avatar w-[40px] h-[40px] rounded-full bg-primary flex items-center justify-center flex-shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="white" stroke-width="2"/>
          <path d="M8 14C8 14 9.5 16 12 16C14.5 16 16 14 16 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="9" cy="9" r="1.5" fill="white"/>
          <circle cx="15" cy="9" r="1.5" fill="white"/>
        </svg>
      </div>
      <div class="message-bubble bg-chat-ai px-4 py-3 rounded-2xl rounded-bl-none">
        <div class="flex items-center gap-1">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </div>
      </div>
    </div>
  }
</div>
