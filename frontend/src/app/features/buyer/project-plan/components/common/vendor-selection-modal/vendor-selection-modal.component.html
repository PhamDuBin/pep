@if (isOpen) {
<div
  class="modal-backdrop fixed inset-0 bg-black/30 flex items-center justify-center z-50"
  (click)="onBackdropClick($event)"
>
  <div
    class="modal-content bg-white rounded-lg shadow-xl p-8 w-[700px] animate-modal-in relative"
  >
    <!-- Close Button -->
    <button
      type="button"
      class="absolute top-4 right-4 text-text-gray hover:text-text-dark transition-colors"
      (click)="onClose()"
    >
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Title -->
    <h2 class="text-[18px] text-primary text-center font-normal mb-6">送信先のベンダーを選択</h2>

    <!-- Search Input -->
    <div class="relative mb-6">
      <div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-gray">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 13L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="ベンダーを検索..."
        class="w-full h-[45px] pl-12 pr-4 border border-primary rounded-full text-[14px] focus:outline-none focus:ring-2 focus:ring-primary/30"
      />
    </div>

    <!-- Vendor List -->
    <div class="vendor-list max-h-[350px] overflow-y-auto mb-6 px-2">
      <div class="grid grid-cols-3 gap-x-4 gap-y-3">
        @for (vendor of filteredVendors; track vendor.id) {
        <label
          class="vendor-item flex items-center gap-2 py-2 cursor-pointer hover:bg-gray-50 transition-colors rounded"
          [class.selected]="isVendorSelected(vendor.id)"
        >
          <input
            type="checkbox"
            [checked]="isVendorSelected(vendor.id)"
            (change)="toggleVendor(vendor.id)"
            class="w-5 h-5 rounded border-2 border-primary text-primary focus:ring-primary cursor-pointer"
          />
          <span class="text-[14px] text-text-dark">{{ vendor.name }}</span>
        </label>
        }
      </div>
    </div>

    <!-- Action Button -->
    <div class="flex justify-center">
      <button
        type="button"
        class="px-10 py-2.5 bg-primary text-white rounded-lg text-[14px] hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="selectedCount === 0"
        (click)="onSend()"
      >
        送信
      </button>
    </div>
  </div>
</div>
}
