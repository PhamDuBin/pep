<div class="min-h-screen bg-white">
  <!-- Header -->
  <app-header></app-header>

  <!-- Side Menu -->
  <app-side-menu></app-side-menu>

  <!-- Main Content Area -->
  <main class="ml-[197px] pt-[89px]">
    <!-- Tab Navigation -->
    <app-tab-navigation [tabs]="tabs" (tabChange)="onTabChange($event)"></app-tab-navigation>

    <!-- Chat Content Area -->
    <div class="flex flex-col h-[calc(100vh-89px-94px)] bg-white px-[75px] py-[50px]">
      <!-- Chat Messages Container -->
      <div class="flex-1 flex flex-col gap-[25px] items-center overflow-hidden">
        <div #scrollContainer class="w-full max-w-[800px] flex-1 overflow-y-auto flex flex-col gap-4 pr-2 scrollable-container">
          <!-- Message List -->
          <app-shared-chat-message-list
            class="flex-shrink-0"
            [messages]="messages()"
            [isLoading]="isLoading()"
            messageVariant="with-avatar"
            [charsPerFrame]="1"
            [typingSpeed]="15"
            [useInternalScroll]="false"
            (contentChanged)="onChatContentChanged()"
          ></app-shared-chat-message-list>

          <!-- PDF Preview (shown after AI generates plan) -->
          @if (showPdfPreview()) {
          <app-shared-pdf-preview
            class="flex-shrink-0"
            [pages]="pdfPages()"
            [completedCount]="5"
            [totalCount]="5"
            (download)="onDownloadClick()"
            (confirm)="onConfirmClick()"
          ></app-shared-pdf-preview>
          }
        </div>
      </div>

      <!-- Bottom Section: Mode Indicator + Description + Input -->
      <div
        class="flex flex-col gap-[20px] items-center justify-center w-full max-w-[800px] mx-auto pt-[20px]"
      >
        <!-- Mode Indicator (clickable to go back to buyer home) -->
        <button
          type="button"
          class="flex items-center gap-[5px] px-[15px] py-[7px] bg-gradient-to-r from-[#8ec5d0] to-[#066a9e] rounded-lg hover:opacity-90 transition-opacity cursor-pointer"
          (click)="onBackToBuyerHome()"
        >
          <svg width="12" height="15" viewBox="0 0 12 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 14V1M1 1H9.5L7.5 4.5L9.5 8H1V1Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="text-[14px] text-white font-normal">プロジェクト計画書作成モード ON</span>
        </button>

        <!-- Mode Description -->
        <p class="text-[13px] text-primary text-center p-2 bg-[#F5F5F5] rounded-sm">
          {{ modeDescription }}
        </p>

        <!-- Chat Input -->
        <app-shared-chat-input-box
          [placeholder]="chatPlaceholder"
          (messageSent)="onMessageSent($event)"
          (microphoneClicked)="onMicrophoneClicked()"
        ></app-shared-chat-input-box>
      </div>
    </div>
  </main>

  <!-- Download Format Modal -->
  <app-shared-download-format-modal
    [isOpen]="showDownloadModal()"
    (download)="onDownloadFormat($event)"
    (close)="onCloseDownloadModal()"
  ></app-shared-download-format-modal>

  <!-- RFP Confirm Modal (Step 1) -->
  <app-rfp-confirm-modal
    [isOpen]="showRfpConfirmModal()"
    (selectVendors)="onSelectVendors()"
    (close)="onCloseRfpConfirmModal()"
  ></app-rfp-confirm-modal>

  <!-- Vendor Selection Modal (Step 2) -->
  <app-vendor-selection-modal
    [isOpen]="showVendorSelectionModal()"
    [vendors]="availableVendors()"
    (send)="onSendRfp($event)"
    (close)="onCloseVendorSelectionModal()"
  ></app-vendor-selection-modal>

  <!-- RFP Sent Modal (Step 3) -->
  <app-shared-rfp-sent-modal
    [isOpen]="showRfpSentModal()"
    [vendors]="sentVendors()"
    [itemsPerRow]="3"
    (vendorChat)="onVendorChat()"
    (close)="onCloseRfpModal()"
  ></app-shared-rfp-sent-modal>
</div>
