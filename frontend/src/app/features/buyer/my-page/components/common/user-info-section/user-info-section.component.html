<!-- User Info Section matching Figma G-01 design -->
<div class="user-info-section">
  <!-- Section Header -->
  <div class="section-header">
    <h2 class="section-title">ユーザー情報</h2>
  </div>

  <!-- Section Content -->
  <div class="section-content">
    <!-- Avatar Row -->
    <div class="avatar-row">
      <div
        class="avatar"
        [style.background-color]="user?.avatarColor || '#8ec5d0'"
        (click)="onAvatarClick()"
      >
        <span class="avatar-initials">{{ user?.initials || 'TY' }}</span>
      </div>
      <button class="btn-select-image" type="button" (click)="onAvatarClick()">
        画像を選択
      </button>
    </div>

    <!-- Form Fields -->
    <div class="form-fields">
      <!-- Name Field -->
      <div class="form-row">
        <label class="form-label">氏名</label>
        <div class="form-value">
          <span class="value-text">{{ user?.name || '' }}</span>
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-row">
        <label class="form-label">メールアドレス</label>
        <div class="form-value email-field">
          <span class="value-text">{{ user?.email || '' }}</span>
          <button
            class="btn-link"
            type="button"
            (click)="onChangeEmailClick()"
          >
            メールアドレスを変更
          </button>
        </div>
      </div>

      <!-- Current Password Field -->
      <div class="form-row">
        <label class="form-label">現在のパスワード</label>
        <div class="form-value">
          <span class="value-text">**********</span>
        </div>
      </div>

      <!-- New Password Field -->
      <div class="form-row">
        <label class="form-label">新しいパスワード</label>
        <div class="form-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-input"
            placeholder="8〜16文字の英数字で入力"
            [value]="newPassword"
            (input)="onNewPasswordInput($event)"
          />
          <button
            class="btn-toggle-visibility"
            type="button"
            (click)="onTogglePassword()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z"
                fill="#808080"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-row">
        <label class="form-label">新しいパスワード（確認）</label>
        <div class="form-input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-input"
            placeholder="8〜16文字の英数字で入力"
            [value]="confirmPassword"
            (input)="onConfirmPasswordInput($event)"
          />
          <button
            class="btn-toggle-visibility"
            type="button"
            (click)="onToggleConfirmPassword()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z"
                fill="#808080"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Save Button -->
    <div class="save-button-wrapper">
      <button
        class="btn-save"
        type="button"
        [disabled]="isSaving"
        (click)="onSaveChanges()"
      >
        {{ isSaving ? '保存中...' : '変更を保存' }}
      </button>
    </div>
  </div>
</div>
