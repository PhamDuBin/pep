@if (isOpen) {
<div class="modal-backdrop fixed inset-0 bg-black/30 flex items-center justify-center z-50"
    (click)="onBackdropClick($event)">
    <div class="modal-content bg-white rounded-lg shadow-xl p-8 w-[500px] animate-modal-in relative">
        <!-- Close Button -->
        <button type="button" class="absolute top-4 right-4 text-[#808080] hover:text-[#333333] transition-colors"
            (click)="onClose()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
        </button>

        <!-- Title -->
        <h2 class="font-noto font-bold text-[20px] leading-[27px] text-[#000000] mb-6 text-center">
            パスワードを変更
        </h2>

        <!-- Current Password -->
        <div class="mb-4">
            <app-password-input label="現在のパスワード" placeholder="●●●●●●●●●●" [(value)]="currentPassword">
            </app-password-input>
        </div>

        <!-- New Password -->
        <div class="mb-4">
            <app-password-input label="新しいパスワード" placeholder="●●●●●●●●●●" [(value)]="newPassword">
            </app-password-input>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-4">
            <app-password-input label="新しいパスワード（確認）" placeholder="●●●●●●●●●●" [(value)]="confirmPassword">
            </app-password-input>
        </div>

        <!-- Error Message -->
        @if (errorMessage) {
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded">
            <p class="font-noto text-[12px] text-red-600">{{ errorMessage }}</p>
        </div>
        }

        <!-- Action Buttons -->
        <div class="flex justify-center gap-3 mt-6">
            <button type="button"
                class="px-6 py-2 bg-primary text-white rounded-lg font-noto text-[14px] hover:opacity-90 transition-opacity"
                (click)="onSave()">
                保存
            </button>
            <button type="button"
                class="px-6 py-2 border border-[#D4D4D4] rounded-lg font-noto text-[14px] text-[#333333] hover:bg-gray-50 transition-colors"
                (click)="onClose()">
                キャンセル
            </button>
        </div>
    </div>
</div>
}
