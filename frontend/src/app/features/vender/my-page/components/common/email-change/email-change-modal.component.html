@if (isOpen) {
<div class="modal-backdrop fixed inset-0 bg-black/10 flex items-center justify-center z-50"
    (click)="onBackdropClick($event)">
    <!-- Modal Content -->
    <div class="relative bg-white rounded-xl shadow-xl p-[20px_35px] w-[674px] flex flex-col items-center gap-[25px]">

        <!-- Close Button (Outside modal, top-right) -->
        <button type="button"
            class="absolute -top-[20px] -right-[20px] w-[40px] h-[40px] bg-[#F5F5F5] rounded-full flex items-center justify-center hover:bg-[#E5E5E5] transition-colors"
            (click)="onClose()">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 1L1 9M1 1L9 9" stroke="#333333" stroke-width="1.5" stroke-linecap="round" />
            </svg>
        </button>

        <!-- Content Container -->
        <div class="flex flex-col items-center gap-[25px] w-[604px]">
            <!-- Title -->
            <h2 class="font-noto text-[20px] leading-[27px] text-primary">
                メールアドレスを変更
            </h2>

            <!-- Form Container -->
            <div class="flex flex-col items-center gap-[25px] w-[534px]">
                <!-- Instruction Text -->
                <p class="font-noto-jp font-medium text-[14px] leading-[130%] text-center text-[#000000]">
                    新しいメールアドレス入力してください。<br>メールアドレス再設定用URLを送信します。
                </p>

                <!-- Input Fields -->
                <div class="flex flex-col items-start gap-[10px] w-full">
                    <!-- New Email Field -->
                    <div class="flex flex-row items-center gap-[10px] w-full">
                        <label class="w-[224px] font-noto text-[16px] leading-[22px] text-[#000000]">
                            新しいメールアドレス
                        </label>
                        <input type="email" [(ngModel)]="newEmail" placeholder="メールアドレス"
                            class="w-[300px] h-[35px] px-[10px] py-[3px] bg-white border border-[#B9B9B9] rounded font-noto text-[16px] leading-[22px] text-[#000000] placeholder:text-[#808080]" />
                    </div>

                    <!-- Confirm Email Field -->
                    <div class="flex flex-row items-center gap-[10px] w-full">
                        <label class="w-[224px] font-noto text-[16px] leading-[22px] text-[#000000]">
                            新しいメールアドレス（確認）
                        </label>
                        <input type="email" [(ngModel)]="confirmEmail" placeholder="メールアドレス"
                            class="w-[300px] h-[35px] px-[10px] py-[3px] bg-white border border-[#B9B9B9] rounded font-noto text-[16px] leading-[22px] text-[#000000] placeholder:text-[#808080]" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        @if (errorMessage) {
        <div class="w-full px-4 py-2 bg-red-50 border border-red-200 rounded">
            <p class="font-noto text-[12px] text-red-600 text-center">{{ errorMessage }}</p>
        </div>
        }

        <!-- Action Buttons -->
        <div class="flex flex-row items-start gap-[10px]">
            <button type="button"
                class="px-[15px] py-[10px] bg-[#333333] hover:bg-[#222222] text-white rounded-lg font-noto text-[14px] leading-[19px] transition-colors"
                (click)="onSave()">
                メールを送信
            </button>
            <button type="button"
                class="px-[15px] py-[10px] bg-[#E1E1E1] hover:bg-[#D1D1D1] text-[#333333] rounded-lg font-noto text-[14px] leading-[19px] transition-colors"
                (click)="onClose()">
                閉じる
            </button>
        </div>
    </div>
</div>
}
