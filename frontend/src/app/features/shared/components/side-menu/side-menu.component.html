<aside
  class="fixed left-0 top-[89px] bottom-0 bg-white flex flex-col justify-between items-start py-[15px] px-[10px] pb-[25px] z-40 transition-all duration-300"
  [class.w-[197px]]="!isCollapsed()"
  [class.w-[50px]]="isCollapsed()"
  style="box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1)"
>
  <!-- Top Section (Frame 14) -->
  <div class="flex flex-col items-start gap-[25px] self-stretch overflow-hidden">
    <!-- Menu Toggle -->
    <div
      class="flex flex-col gap-[3px] w-full"
      [class.items-center]="isCollapsed()"
      [class.items-start]="!isCollapsed()"
    >
      <button class="hover:opacity-70 transition-opacity" (click)="toggleMenu()">
        <img src="assets/icons/menu-toggle.svg" alt="Menu" width="20" height="13" />
      </button>
    </div>

    <!-- New Project Button -->
    <div class="flex flex-col gap-[3px] w-full">
      <button
        class="flex flex-row items-center py-[3px] gap-[7px] w-full h-[26px] rounded cursor-pointer hover:bg-[#F0F0F0] active:bg-[#F0F0F0] transition-colors"
        [class.justify-center]="isCollapsed()"
        (click)="navigateToNewProject()"
      >
        <div class="w-5 h-5 bg-primary rounded-full flex items-center justify-center flex-shrink-0">
          <img src="assets/icons/plus.svg" alt="Plus" width="10" height="10" />
        </div>
        <span class="text-[13px] text-text-dark whitespace-nowrap" [class.hidden]="isCollapsed()"
          >新規プロジェクト作成</span
        >
      </button>
    </div>

    <!-- Separator Line -->
    <div class="w-full h-[1px] bg-gray-200"></div>

    <!-- RFP Section -->
    <div class="flex flex-col gap-[3px] w-full" [class.hidden]="isCollapsed()">
      <div>
        <span class="text-[14px] text-text-gray">RFP</span>
      </div>
      <div
        class="archive-menu-item flex items-center gap-[7px] py-[5px] cursor-pointer rounded transition-colors -mx-[10px] px-[10px] w-full"
        [class.active]="isArchiveActive()"
        (click)="navigateToArchive()"
      >
        <img src="assets/icons/folder.svg" alt="Archive" width="22" height="22" />
        <span class="text-[13px] text-text-dark">アーカイブ</span>
      </div>
    </div>

    <!-- RFP Section Collapsed -->
    <div class="flex flex-col gap-[3px] w-full items-center" [class.hidden]="!isCollapsed()">
      <div
        class="archive-menu-item flex items-center justify-center py-[5px] cursor-pointer rounded transition-colors w-full"
        [class.active]="isArchiveActive()"
        (click)="navigateToArchive()"
      >
        <img src="assets/icons/folder.svg" alt="Archive" width="22" height="22" />
      </div>
    </div>

    <!-- PROJECT Section -->
    <div class="flex flex-col gap-[5px]" [class.hidden]="isCollapsed()">
      <div>
        <span class="text-[14px] text-text-gray">PROJECT</span>
      </div>

      <!-- Search -->
      <div
        class="flex items-center gap-[7px] py-[7px] cursor-pointer hover:bg-gray-50 rounded transition-colors -mx-[10px] px-[10px]"
      >
        <img src="assets/icons/search.svg" alt="Search" width="20" height="20" />
        <span class="text-[13px] text-text-dark">プロジェクト検索</span>
      </div>

      <!-- Project List -->
      <div class="flex flex-col gap-[5px]">
        @for (project of projects(); track project.id) {
        <div
          class="flex items-center gap-[3px] py-[5px] rounded cursor-pointer transition-colors group -mx-[10px] px-[10px]"
          [class.bg-primary-light]="project.isSelected"
          [class.hover:bg-gray-50]="!project.isSelected"
          (click)="selectProject(project)"
        >
          <img
            [src]="
              project.isSelected ? 'assets/icons/project-active.svg' : 'assets/icons/project.svg'
            "
            alt="Project"
            width="10"
            height="12"
            class="flex-shrink-0"
          />
          <span
            class="text-[14px] flex-1 truncate font-normal"
            [class.text-primary]="project.isSelected"
            [class.text-text-dark]="!project.isSelected"
            >{{ project.name }}</span
          >
          @if (project.isSelected) {
          <img
            src="assets/icons/more-dots.svg"
            alt="More"
            width="16"
            height="16"
            class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity"
          />
          }
        </div>
        }
      </div>
    </div>

    <!-- PROJECT Section Collapsed -->
    <div class="flex flex-col gap-[5px] items-center w-full" [class.hidden]="!isCollapsed()">
      <div
        class="flex items-center justify-center py-[7px] cursor-pointer hover:bg-gray-50 rounded transition-colors w-full"
      >
        <img src="assets/icons/search.svg" alt="Search" width="20" height="20" />
      </div>
    </div>
  </div>

  <!-- Bottom Section (Frame 15) -->
  <div
    class="flex flex-col justify-center gap-[5px] w-full self-stretch"
    [class.items-start]="!isCollapsed()"
    [class.items-center]="isCollapsed()"
  >
    <!-- User List -->
    <div
      class="user-list-item flex items-center py-[7px] cursor-pointer rounded transition-colors"
      [class.active]="isUserListActive()"
      [class.gap-[7px]]="!isCollapsed()"
      [class.-mx-[10px]]="!isCollapsed()"
      [class.px-[10px]]="!isCollapsed()"
      [class.w-full]="!isCollapsed()"
      [class.justify-center]="isCollapsed()"
      [class.px-[5px]]="isCollapsed()"
      (click)="navigateToUserList()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="23"
        height="16"
        viewBox="0 0 23 16"
        fill="none"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M7.475 8C9.69852 8 11.5 6.20971 11.5 4C11.5 1.79029 9.69852 0 7.475 0C5.25147 0 3.45 1.79029 3.45 4C3.45 6.20971 5.25147 8 7.475 8ZM10.35 4C10.35 5.57886 9.06372 6.85714 7.475 6.85714C5.88627 6.85714 4.6 5.57886 4.6 4C4.6 2.42114 5.88627 1.14286 7.475 1.14286C9.06372 1.14286 10.35 2.42114 10.35 4ZM0 16V12.8C0 10.368 4.98007 9.14286 7.475 9.14286C9.13445 9.14286 11.8939 9.68514 13.5556 10.764C14.7401 10.4457 16.039 10.2857 16.9625 10.2857C18.0308 10.2857 19.4643 10.4994 20.6482 10.9314C21.2382 11.1474 21.8034 11.4309 22.2306 11.7977C22.6613 12.1674 23 12.6674 23 13.2949V16H0ZM1.15 12.8C1.15 12.6189 1.23395 12.3709 1.59045 12.0486C1.95442 11.7194 2.51447 11.4006 3.22345 11.1229C4.64427 10.5657 6.36928 10.2857 7.475 10.2857C8.58072 10.2857 10.3063 10.5657 11.726 11.1229C12.4355 11.4006 12.9956 11.7194 13.359 12.0486C13.716 12.3709 13.8 12.6189 13.8 12.8V14.8571H1.15V12.8ZM14.578 11.6971C15.448 11.5183 16.3202 11.4286 16.9625 11.4286C17.9095 11.4286 19.2067 11.6229 20.2515 12.0046C20.7742 12.1954 21.1968 12.4206 21.4791 12.6629C21.758 12.9023 21.85 13.1126 21.85 13.2954V14.8571H14.95V12.8C14.95 12.4 14.8149 12.0314 14.578 11.6971ZM20.125 6C20.125 7.73657 18.7099 9.14286 16.9625 9.14286C16.1238 9.14286 15.3194 8.81174 14.7263 8.22234C14.1332 7.63294 13.8 6.83354 13.8 6C13.8 4.26343 15.2151 2.85714 16.9625 2.85714C18.7099 2.85714 20.125 4.26343 20.125 6ZM16.9625 8C18.0745 8 18.975 7.10514 18.975 6C18.975 4.89486 18.0745 4 16.9625 4C16.4288 4 15.9169 4.21071 15.5394 4.58579C15.162 4.96086 14.95 5.46957 14.95 6C14.95 7.10514 15.8504 8 16.9625 8Z"
          fill="#333333"
        />
      </svg>
      <span
        class="text-[13px]"
        [class.text-primary]="isUserListActive()"
        [class.text-text-dark]="!isUserListActive()"
        [class.hidden]="isCollapsed()"
        >ユーザ一覧</span
      >
    </div>

    <!-- User Profile -->
    <div
      class="user-profile-item flex items-center py-[5px] cursor-pointer rounded transition-colors"
      [class.active]="isMyPageActive()"
      [class.gap-[7px]]="!isCollapsed()"
      [class.-mx-[10px]]="!isCollapsed()"
      [class.px-[10px]]="!isCollapsed()"
      [class.w-full]="!isCollapsed()"
      [class.justify-center]="isCollapsed()"
      [class.px-[5px]]="isCollapsed()"
      (click)="navigateToMyPage()"
    >
      <div
        class="w-[30px] h-[30px] bg-avatar-bg rounded-full flex items-center justify-center flex-shrink-0"
      >
        <span class="text-[13px] text-white">TY</span>
      </div>
      <span
        class="text-[13px]"
        [class.text-primary]="isMyPageActive()"
        [class.text-text-dark]="!isMyPageActive()"
        [class.hidden]="isCollapsed()"
        >山田 太郎</span
      >
    </div>
  </div>
</aside>
